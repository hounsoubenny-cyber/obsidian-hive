# tests/pytest.ini
[pytest]
# Désactiver les warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Async mode
asyncio_mode = auto

# Logging minimal
log_cli = false
log_level = ERROR

# Éviter les collisions de noms
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Timeout par défaut (optionnel)
timeout = 30

# Marqueurs
markers =
    asyncio: Tests asynchrones
    slow: Tests lents
    network: Tests nécessitant réseau (désactivés par défaut)