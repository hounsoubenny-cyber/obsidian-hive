{% extends "base.html" %}
{% block title %}Avis clients — VulnMart{% endblock %}
{% block content %}
<div class="container">
  <div class="section">
    <h2>Mur d'avis clients <span class="vuln-tag">XSS stocké</span></h2>
    <form class="panel" method="POST">
      <label>Nom</label>
      <input type="text" name="author">
      <label>Message</label>
      <textarea name="body"></textarea>
      <button class="btn" style="margin-top:16px;" type="submit">Publier</button>
    </form>
    {% for c in comments %}
    <div class="review">
      <div class="author">{{ c['author'] }}</div>
      <div>{{ c['body']|safe }}</div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
