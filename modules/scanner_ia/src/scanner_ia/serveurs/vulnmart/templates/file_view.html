{% extends "base.html" %}
{% block title %}Documents — VulnMart{% endblock %}
{% block content %}
<div class="container">
  <div class="tool-box">
    <h2>Centre de documents <span class="vuln-tag">Path Traversal</span></h2>
    <form method="GET">
      <label style="display:block;font-size:.8rem;margin-bottom:6px;">Nom du fichier</label>
      <input class="mono" style="width:100%;padding:8px;border:1px solid var(--line);" type="text" name="name" value="{{ name }}">
      <button class="btn" style="margin-top:12px;" type="submit">Ouvrir</button>
    </form>
    <p style="font-size:.8rem;margin-top:10px;">Essayez : <code>../app.py</code> ou <code>../../../../etc/passwd</code></p>
    <pre class="output">{{ content }}</pre>
  </div>
</div>
{% endblock %}
