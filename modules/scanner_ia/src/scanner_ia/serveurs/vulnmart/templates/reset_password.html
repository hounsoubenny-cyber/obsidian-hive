{% extends "base.html" %}
{% block title %}Réinitialiser le mot de passe — VulnMart{% endblock %}
{% block content %}
<div class="container">
  <h2 style="text-align:center;margin-top:40px;">Mot de passe oublié <span class="vuln-tag">Token prévisible + énumération</span></h2>
  {% if message %}<div class="alert info">{{ message }}</div>{% endif %}
  <form class="panel" method="POST">
    <label>Email</label>
    <input type="email" name="email">
    <button class="btn" style="margin-top:20px;width:100%;" type="submit">Envoyer le lien</button>
  </form>
</div>
{% endblock %}
