{% extends "base.html" %}
{% block title %}Recherche — VulnMart{% endblock %}
{% block content %}
<div class="container">
  <div class="section">
    <h2>Recherche <span class="vuln-tag">XSS réfléchi</span></h2>
    <form class="panel" method="GET" style="max-width:600px;">
      <label>Requête</label>
      <input type="text" name="q" value="{{ q }}">
      <button class="btn" style="margin-top:16px;" type="submit">Chercher</button>
    </form>
    {% if q %}
    <p>Résultats pour : <strong>{{ q|safe }}</strong></p>
    {% endif %}
    <div class="grid">
      {% for p in results %}
      <div class="card">
        <img src="{{ p['image_url'] }}" alt="{{ p['name'] }}">
        <a class="name" href="{{ url_for('product', pid=p['id']) }}">{{ p['name'] }}</a>
        <div class="price mono">{{ "%.2f"|format(p['price']) }} €</div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
