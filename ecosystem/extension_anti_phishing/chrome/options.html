<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Options — Obsidian Hive Anti-Phishing</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input[type="text"] { width: 100%; padding: 6px; box-sizing: border-box; }
    .toggle-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
    button { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
    #saveStatus { margin-left: 10px; font-size: 13px; color: #16a34a; }
  </style>
</head>
<body>
  <h1>🛡️ Obsidian Hive — Anti-Phishing</h1>

  <label for="token">Token d'extension</label>
  <input type="text" id="token" placeholder="token_id.secret" autocomplete="off" />
  <p style="font-size:12px; color:#6b7280;">Généré depuis le dashboard admin (menu Extensions), à coller ici une seule fois.</p>

  <div class="toggle-row">
    <input type="checkbox" id="checkOnLoad" />
    <label for="checkOnLoad" style="margin:0;">Analyser les liens au chargement de la page</label>
  </div>
  <div class="toggle-row">
    <input type="checkbox" id="checkOnHover" />
    <label for="checkOnHover" style="margin:0;">Analyser au survol des liens</label>
  </div>

  <button id="save">Enregistrer</button>
  <span id="saveStatus"></span>

  <script src="options.js"></script>
</body>
</html>
