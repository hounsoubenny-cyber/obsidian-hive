<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ohBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161a22"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="ohAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c8cff"/>
      <stop offset="100%" stop-color="#5b6ee8"/>
    </linearGradient>
  </defs>

  <!-- fond hexagonal (ruche) -->
  <polygon points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5"
           fill="url(#ohBg)" stroke="#262c3a" stroke-width="1.5"/>

  <!-- alvéoles internes (motif ruche, en fil) -->
  <g fill="none" stroke="url(#ohAccent)" stroke-width="1.3" opacity="0.55">
    <polygon points="32,14 41,19 41,29 32,34 23,29 23,19"/>
    <polygon points="18,24 27,29 27,39 18,44 9,39 9,29"/>
    <polygon points="46,24 55,29 55,39 46,44 37,39 37,29"/>
  </g>

  <!-- bouclier central plein, accent -->
  <path d="M32 16 L44 21 V32 C44 41 38.5 47 32 50 C25.5 47 20 41 20 32 V21 Z"
        fill="url(#ohAccent)"/>
  <path d="M32 16 L44 21 V32 C44 41 38.5 47 32 50 C25.5 47 20 41 20 32 V21 Z"
        fill="none" stroke="#0d0f14" stroke-width="0.5" opacity="0.3"/>

  <!-- coche stylisée / éclat au centre du bouclier -->
  <path d="M27 31.5 L31 36 L38 26" fill="none" stroke="#0d0f14" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
