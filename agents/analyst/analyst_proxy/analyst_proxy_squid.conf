# Allowlist de domaines pour le proxy de sortie du conteneur Alex.
# Écoute sur 8888 pour matcher WorkspaceConfig.proxy_url = "http://alex-proxy:8888"
http_port 8888

acl allowed_domains dstdomain \
    pypi.org \
    files.pythonhosted.org \
    pythonhosted.org \
    github.com \
    codeload.github.com \
    raw.githubusercontent.com \
    objects.githubusercontent.com \
    registry.npmjs.org \
    registry.yarnpkg.com

acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access allow CONNECT allowed_domains Safe_ports
http_access allow allowed_domains Safe_ports
http_access deny all

cache deny all
access_log /var/log/squid/access.log
